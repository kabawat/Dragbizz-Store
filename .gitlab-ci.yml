stages:
  - test
  - deploy

# ─── 1. Lint Check ───────────────────────────────────────────────────────────
lint_check:
  stage: test
  image: node:22-alpine
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  script:
    - yarn install --frozen-lockfile --silent
    - yarn lint
  only:
    - develop
    - main
    - master

# ─── 2. Deploy to Staging ─────────────────────────────────────────────────────
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging..."
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "
        cd $DEPLOY_PATH &&
        git pull origin develop &&
        yarn install &&
        yarn build &&
        pm2 restart all &&
        pm2 save
      "
  environment:
    name: staging
  only:
    - develop
  when: on_success
  needs: [lint_check]

# ─── 3. Deploy to Production ──────────────────────────────────────────────────
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "
        cd $DEPLOY_PATH &&
        git pull origin main &&
        yarn install &&
        yarn build &&
        pm2 restart all &&
        pm2 save
      "
  environment:
    name: production
  only:
    - main
    - master
  when: manual
